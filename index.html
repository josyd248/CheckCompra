<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almacén y Lista de Compra</title>
    <!-- Tailwind CSS Script -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col font-sans antialiased selection:bg-indigo-500 selection:text-white">
    <!-- Header Principal -->
    <header class="bg-white border-b border-slate-200 text-slate-900 shadow-sm sticky top-0 z-40">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="bg-indigo-600 p-2 rounded-xl text-white shadow-md shadow-indigo-600/20">
                    <i class="fa-solid fa-boxes-stacked text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base leading-tight tracking-tight">Mi Despensa</h1>
                    <p class="text-xs text-slate-500">Almacén y Compra Inteligente</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="openSupermarketsModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 px-3 py-1.5 rounded-xl text-xs font-medium transition flex items-center space-x-1.5 shadow-sm">
                    <i class="fa-solid fa-store text-indigo-600"></i>
                    <span>Súpers</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-1 max-w-md w-full mx-auto px-4 py-4 pb-28 no-scrollbar overflow-y-auto">
        <!-- VISTA 1: ALMACÉN -->
        <div id="view-storage" class="space-y-4">
            <!-- Barra de Acciones y Filtros -->
            <div class="flex flex-col space-y-3">
                <div class="flex items-center justify-between">
                    <h2 class="text-lg font-bold tracking-tight text-slate-900">Inventario Almacén</h2>
                    <button onclick="openProductModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow-lg shadow-indigo-600/20 flex items-center space-x-2 transition transform active:scale-95">
                        <i class="fa-solid fa-plus"></i>
                        <span>Añadir Producto</span>
                    </button>
                </div>

                <!-- Buscador y Filtros de Categoría -->
                <div class="flex space-x-2">
                    <div class="relative flex-1">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
                        <input type="text" id="searchStorageInput" placeholder="Buscar en almacén..." oninput="renderStorage()" class="w-full bg-white border border-slate-200 rounded-xl pl-9 pr-3 py-2 text-xs text-slate-900 placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 shadow-sm">
                    </div>
                </div>

                <!-- Filtros Chips Categoría -->
                <div class="flex space-x-2 overflow-x-auto no-scrollbar pb-1">
                    <button onclick="setStorageFilter('all')" id="filter-all" class="filter-btn px-3 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap bg-indigo-600 text-white shadow-sm transition">Todos</button>
                    <button onclick="setStorageFilter('comida')" id="filter-comida" class="filter-btn px-3 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap bg-white border border-slate-200 text-slate-600 hover:bg-slate-100 transition shadow-sm">Comida</button>
                    <button onclick="setStorageFilter('limpieza')" id="filter-limpieza" class="filter-btn px-3 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap bg-white border border-slate-200 text-slate-600 hover:bg-slate-100 transition shadow-sm">Limpieza</button>
                </div>
            </div>

            <!-- Lista de Productos en Almacén -->
            <div id="storageListContainer" class="space-y-3">
                <!-- Se renderiza vía JS -->
            </div>
        </div>

        <!-- VISTA 2: LISTA DE COMPRA -->
        <div id="view-shopping" class="space-y-4 hidden">
            <div class="flex items-center justify-between">
                <div>
                    <h2 class="text-lg font-bold tracking-tight text-slate-900">Lista de la Compra</h2>
                    <p class="text-xs text-slate-500">Productos por reponer y ocasionales</p>
                </div>
                <button onclick="openOccasionalModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-xl text-xs font-semibold shadow-lg shadow-emerald-600/20 flex items-center space-x-1.5 transition">
                    <i class="fa-solid fa-cart-plus"></i>
                    <span>Añadir Ocasional</span>
                </button>
            </div>

            <!-- Filtros Supermercados para la compra -->
            <div class="bg-white border border-slate-200 p-3 rounded-2xl shadow-sm space-y-2">
                <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Filtrar por Supermercado</span>
                <div id="shoppingSupermarketFilters" class="flex flex-wrap gap-1.5">
                    <!-- Se carga dinámicamente -->
                </div>
            </div>

            <!-- Contenedor Lista Compra -->
            <div id="shoppingListContainer" class="space-y-3">
                <!-- Se renderiza vía JS -->
            </div>
        </div>
    </main>

    <!-- Navegación Inferior Móvil -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 z-40 max-w-md mx-auto shadow-lg">
        <div class="flex justify-around items-center h-16 px-2">
            <button onclick="switchTab('storage')" id="nav-storage" class="flex-1 flex flex-col items-center justify-center py-1 text-indigo-600 transition">
                <i class="fa-solid fa-apple-whole text-lg mb-0.5"></i>
                <span class="text-[11px] font-medium">Almacén</span>
            </button>
            <button onclick="switchTab('shopping')" id="nav-shopping" class="flex-1 flex flex-col items-center justify-center py-1 text-slate-400 hover:text-slate-600 transition">
                <div class="relative">
                    <i class="fa-solid fa-basket-shopping text-lg mb-0.5"></i>
                    <span id="shoppingBadge" class="absolute -top-1 -right-2 bg-rose-500 text-white text-[9px] font-bold px-1.5 py-0.2 rounded-full hidden">0</span>
                </div>
                <span class="text-[11px] font-medium">Para Reponer</span>
            </button>
        </div>
    </nav>

    <!-- MODAL PRODUCTO (ALMACÉN) -->
    <div id="productModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="bg-white border border-slate-200 w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 id="productModalTitle" class="font-bold text-base text-slate-900">Nuevo Producto</h3>
                <button onclick="closeProductModal()" class="text-slate-400 hover:text-slate-600 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <form id="productForm" onsubmit="saveProduct(event)" class="space-y-3">
                <input type="hidden" id="productId">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Nombre del Producto</label>
                    <input type="text" id="prodName" required placeholder="Ej. Leche entera, Detergente..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-900 placeholder-slate-400 focus:outline-none focus:border-indigo-500">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Categoría</label>
                        <select id="prodCategory" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-indigo-500">
                            <option value="comida">Comida</option>
                            <option value="limpieza">Limpieza</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Modo de Control</label>
                        <select id="prodControlType" onchange="toggleControlTypeFields()" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-indigo-500">
                            <option value="quantity">Por Cantidad</option>
                            <option value="expiry">Por Caducidad / Tiempo</option>
                        </select>
                    </div>
                </div>

                <!-- Campos condicionales -->
                <div id="fieldsQuantity" class="grid grid-cols-2 gap-2 bg-slate-50 p-3 rounded-2xl border border-slate-200">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-700 mb-1">Cantidad Actual</label>
                        <input type="number" id="prodCurrentQty" min="0" value="1" class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-700 mb-1">Stock Mínimo (Alerta)</label>
                        <input type="number" id="prodMinQty" min="0" value="1" class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>

                <div id="fieldsExpiry" class="bg-slate-50 p-3 rounded-2xl border border-slate-200 hidden">
                    <label class="block text-[11px] font-semibold text-slate-700 mb-1">Fecha Límite / Consumo Estimado</label>
                    <input type="date" id="prodExpiryDate" class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-indigo-500">
                </div>

                <!-- Supermercados asignados -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Supermercados de compra</label>
                    <div id="productSupermarketsCheckboxContainer" class="flex flex-wrap gap-2 bg-slate-50 p-3 rounded-2xl border border-slate-200 max-h-32 overflow-y-auto">
                        <!-- Generado por JS -->
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-xl text-xs shadow-lg shadow-indigo-600/20 transition">Guardar Producto</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL GESTIÓN SUPERMERCADOS -->
    <div id="supermarketModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="bg-white border border-slate-200 w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 class="font-bold text-base text-slate-900">Supermercados Personalizados</h3>
                <button onclick="closeSupermarketsModal()" class="text-slate-400 hover:text-slate-600 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <!-- Formulario nuevo súper -->
            <form id="supermarketForm" onsubmit="saveSupermarket(event)" class="space-y-3 bg-slate-50 p-3 rounded-2xl border border-slate-200">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Nombre del Supermercado</label>
                    <input type="text" id="supName" required placeholder="Ej. Mercadona, Carrefour..." class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-900 placeholder-slate-400 focus:outline-none focus:border-indigo-500">
                </div>
                <div class="flex items-center space-x-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Color distintivo</label>
                        <input type="color" id="supColor" value="#4f46e5" class="w-10 h-9 bg-white border border-slate-200 rounded-xl cursor-pointer">
                    </div>
                    <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2 rounded-xl text-xs shadow-md transition self-end">Añadir Supermercado</button>
                </div>
            </form>

            <!-- Lista de supermercados existentes -->
            <div class="space-y-2">
                <h4 class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Supermercados Guardados</h4>
                <div id="supermarketsList" class="space-y-2 max-h-48 overflow-y-auto">
                    <!-- Dinámico -->
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL PRODUCTO OCASIONAL -->
    <div id="occasionalModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="bg-white border border-slate-200 w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 class="font-bold text-base text-slate-900">Añadir Producto Ocasional</h3>
                <button onclick="closeOccasionalModal()" class="text-slate-400 hover:text-slate-600 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <form id="occasionalForm" onsubmit="saveOccasionalProduct(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Nombre del artículo</label>
                    <input type="text" id="occName" required placeholder="Ej. Chips de chocolate, Velas..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-900 placeholder-slate-400 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Supermercados de compra</label>
                    <div id="occasionalSupermarketsCheckboxContainer" class="flex flex-wrap gap-2 bg-slate-50 p-3 rounded-2xl border border-slate-200 max-h-32 overflow-y-auto">
                        <!-- Generado por JS -->
                    </div>
                </div>
                <div class="pt-2">
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-xl text-xs shadow-lg shadow-emerald-600/20 transition">Añadir a la Compra</button>
                </div>
            </form>
        </div>
    </div>

    <!-- LÓGICA DE LA APLICACIÓN -->
    <script>
        // Estado Local de la Aplicación
        let state = {
            storage: JSON.parse(localStorage.getItem('despensa_storage')) || [
                { id: '1', name: 'Leche Desnatada', category: 'comida', controlType: 'quantity', currentQty: 1, minQty: 2, expiryDate: '', supermarkets: ['1'] },
                { id: '2', name: 'Harina de Trigo', category: 'comida', controlType: 'expiry', currentQty: 1, minQty: 1, expiryDate: new Date(Date.now() + 20*86400000).toISOString().split('T')[0], supermarkets: ['1', '2'] },
                { id: '3', name: 'Detergente Lavadora', category: 'limpieza', controlType: 'quantity', currentQty: 3, minQty: 1, expiryDate: '', supermarkets: ['2'] }
            ],
            supermarkets: JSON.parse(localStorage.getItem('despensa_supermarkets')) || [
                { id: '1', name: 'Mercadona', color: '#0047bb' },
                { id: '2', name: 'Carrefour', color: '#004225' },
                { id: '3', name: 'Lidl', color: '#0050aa' }
            ],
            occasionalCatalog: JSON.parse(localStorage.getItem('despensa_occasional')) || [
                { id: 'occ1', name: 'Chips de chocolate', supermarkets: ['1'] }
            ],
            shoppingChecked: JSON.parse(localStorage.getItem('despensa_shopping_checked')) || {},
            activeTab: 'storage',
            storageFilterCat: 'all',
            shoppingFilterSuper: 'all'
        };

        function saveState() {
            localStorage.setItem('despensa_storage', JSON.stringify(state.storage));
            localStorage.setItem('despensa_supermarkets', JSON.stringify(state.supermarkets));
            localStorage.setItem('despensa_occasional', JSON.stringify(state.occasionalCatalog));
            localStorage.setItem('despensa_shopping_checked', JSON.stringify(state.shoppingChecked));
            updateBadge();
        }

        // Inicialización
        window.addEventListener('DOMContentLoaded', () => {
            renderApp();
        });

        function renderApp() {
            renderStorage();
            renderShoppingList();
            renderSupermarketFilters();
            updateBadge();
        }

        // Cambio de Pestañas
        function switchTab(tab) {
            state.activeTab = tab;
            const viewStorage = document.getElementById('view-storage');
            const viewShopping = document.getElementById('view-shopping');
            const navStorage = document.getElementById('nav-storage');
            const navShopping = document.getElementById('nav-shopping');

            if (tab === 'storage') {
                viewStorage.classList.remove('hidden');
                viewShopping.classList.add('hidden');
                navStorage.className = "flex-1 flex flex-col items-center justify-center py-1 text-indigo-600 transition";
                navShopping.className = "flex-1 flex flex-col items-center justify-center py-1 text-slate-400 hover:text-slate-600 transition";
            } else {
                viewStorage.classList.add('hidden');
                viewShopping.classList.remove('hidden');
                navStorage.className = "flex-1 flex flex-col items-center justify-center py-1 text-slate-400 hover:text-slate-600 transition";
                navShopping.className = "flex-1 flex flex-col items-center justify-center py-1 text-indigo-600 transition";
            }
        }

        // Filtro de Almacén
        function setStorageFilter(cat) {
            state.storageFilterCat = cat;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = "filter-btn px-3 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap bg-white border border-slate-200 text-slate-600 hover:bg-slate-100 transition shadow-sm";
            });
            const activeBtn = document.getElementById(`filter-${cat}`);
            if(activeBtn) {
                activeBtn.className = "filter-btn px-3 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap bg-indigo-600 text-white shadow-sm transition";
            }
            renderStorage();
        }

        // Renderizar Almacén
        function renderStorage() {
            const container = document.getElementById('storageListContainer');
            const searchVal = (document.getElementById('searchStorageInput')?.value || '').toLowerCase();
            if (!container) return;

            let items = state.storage.filter(item => {
                const matchCat = state.storageFilterCat === 'all' || item.category === state.storageFilterCat;
                const matchSearch = item.name.toLowerCase().includes(searchVal);
                return matchCat && matchSearch;
            });

            if (items.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-10 bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
                        <i class="fa-solid fa-box-open text-3xl text-slate-300 mb-2"></i>
                        <p class="text-xs text-slate-500">No hay productos en el almacén</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = items.map(item => {
                let statusBadge = '';
                let alertClass = 'border-slate-200 bg-white shadow-sm';
                
                if (item.controlType === 'quantity') {
                    if (item.currentQty <= item.minQty) {
                        statusBadge = `<span class="bg-rose-50 text-rose-600 border border-rose-200 px-2 py-0.5 rounded-full text-[10px] font-semibold flex items-center space-x-1"><i class="fa-solid fa-triangle-exclamation"></i><span>¡Quedan ${item.currentQty}!</span></span>`;
                        alertClass = 'border-rose-200 bg-white shadow-sm shadow-rose-100';
                    } else {
                        statusBadge = `<span class="bg-emerald-50 text-emerald-600 border border-emerald-200 px-2 py-0.5 rounded-full text-[10px] font-semibold">Stock OK (${item.currentQty})</span>`;
                    }
                } else if (item.controlType === 'expiry' && item.expiryDate) {
                    const diffDays = Math.ceil((new Date(item.expiryDate) - new Date()) / (1000 * 60 * 60 * 24));
                    if (diffDays <= 5) {
                        statusBadge = `<span class="bg-rose-50 text-rose-600 border border-rose-200 px-2 py-0.5 rounded-full text-[10px] font-semibold flex items-center space-x-1"><i class="fa-solid fa-clock"></i><span>Caduca en ${diffDays}d</span></span>`;
                        alertClass = 'border-rose-200 bg-white shadow-sm shadow-rose-100';
                    } else {
                        statusBadge = `<span class="bg-indigo-50 text-indigo-600 border border-indigo-200 px-2 py-0.5 rounded-full text-[10px] font-semibold">Caduca: ${item.expiryDate}</span>`;
                    }
                }

                const catIcon = item.category === 'comida' ? 'fa-apple-whole text-emerald-600' : 'fa-spray-can-sparkles text-cyan-600';
                
                const supersHTML = (item.supermarkets || []).map(supId => {
                    const sup = state.supermarkets.find(s => s.id === supId);
                    if (!sup) return '';
                    return `<span class="px-2 py-0.5 rounded-md text-[9px] font-medium text-white shadow-sm" style="background-color: ${sup.color}">${sup.name}</span>`;
                }).join(' ');

                return `
                    <div class="border ${alertClass} rounded-2xl p-3.5 flex flex-col space-y-2.5 transition">
                        <div class="flex justify-between items-start">
                            <div class="flex items-center space-x-2.5">
                                <div class="w-8 h-8 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-center">
                                    <i class="fa-solid ${catIcon} text-xs"></i>
                                </div>
                                <div>
                                    <h4 class="font-bold text-xs text-slate-900">${item.name}</h4>
                                    <p class="text-[10px] text-slate-400 uppercase tracking-wider">${item.category}</p>
                                </div>
                            </div>
                            <div class="flex items-center space-x-1">
                                <button onclick="editProduct('${item.id}')" class="text-slate-400 hover:text-indigo-600 p-1.5 text-xs transition"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="deleteProduct('${item.id}')" class="text-slate-400 hover:text-rose-600 p-1.5 text-xs transition"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>

                        <div class="flex flex-wrap items-center justify-between gap-2 pt-1 border-t border-slate-100">
                            <div class="flex items-center space-x-1.5 flex-wrap">
                                ${statusBadge}
                                ${supersHTML}
                            </div>
                            ${item.controlType === 'quantity' ? `
                                <div class="flex items-center space-x-1">
                                    <button onclick="adjustQty('${item.id}', -1)" class="w-6 h-6 bg-slate-100 border border-slate-200 rounded-lg text-slate-600 hover:bg-slate-200 flex items-center justify-center text-xs font-bold">-</button>
                                    <span class="text-xs font-bold px-1.5 text-slate-700">${item.currentQty}</span>
                                    <button onclick="adjustQty('${item.id}', 1)" class="w-6 h-6 bg-slate-100 border border-slate-200 rounded-lg text-slate-600 hover:bg-slate-200 flex items-center justify-center text-xs font-bold">+</button>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Modificar cantidad rápida
        function adjustQty(id, delta) {
            const item = state.storage.find(i => i.id === id);
            if (item) {
                item.currentQty = Math.max(0, item.currentQty + delta);
                saveState();
                renderStorage();
                renderShoppingList();
            }
        }

        // Abrir Modal Producto
        function openProductModal(id = null) {
            document.getElementById('productId').value = '';
            document.getElementById('prodName').value = '';
            document.getElementById('prodCategory').value = 'comida';
            document.getElementById('prodControlType').value = 'quantity';
            document.getElementById('prodCurrentQty').value = '1';
            document.getElementById('prodMinQty').value = '1';
            document.getElementById('prodExpiryDate').value = '';
            document.getElementById('productModalTitle').innerText = 'Nuevo Producto';
            
            toggleControlTypeFields();
            renderSupermarketsCheckboxes('productSupermarketsCheckboxContainer', []);
            document.getElementById('productModal').classList.remove('hidden');
        }

        function closeProductModal() {
            document.getElementById('productModal').classList.add('hidden');
        }

        function toggleControlTypeFields() {
            const type = document.getElementById('prodControlType').value;
            const fieldsQty = document.getElementById('fieldsQuantity');
            const fieldsExp = document.getElementById('fieldsExpiry');
            if (type === 'quantity') {
                fieldsQty.classList.remove('hidden');
                fieldsExp.classList.add('hidden');
            } else {
                fieldsQty.classList.add('hidden');
                fieldsExp.classList.remove('hidden');
            }
        }

        function renderSupermarketsCheckboxes(containerId, selectedSupIds) {
            const container = document.getElementById(containerId);
            if (!container) return;

            if (state.supermarkets.length === 0) {
                container.innerHTML = `<p class="text-[11px] text-slate-400">No hay supermercados creados. Añade alguno en el botón superior.</p>`;
                return;
            }

            container.innerHTML = state.supermarkets.map(sup => {
                const checked = selectedSupIds.includes(sup.id) ? 'checked' : '';
                return `
                    <label class="flex items-center space-x-2 bg-white border border-slate-200 px-2.5 py-1.5 rounded-xl cursor-pointer hover:bg-slate-50 transition shadow-sm">
                        <input type="checkbox" name="sup_checkbox" value="${sup.id}" ${checked} class="rounded border-slate-300 bg-white text-indigo-600 focus:ring-indigo-500 h-3.5 w-3.5">
                        <span class="w-2.5 h-2.5 rounded-full" style="background-color: ${sup.color}"></span>
                        <span class="text-xs text-slate-700 font-medium">${sup.name}</span>
                    </label>
                `;
            }).join('');
        }

        function saveProduct(e) {
            e.preventDefault();
            const id = document.getElementById('productId').value;
            const name = document.getElementById('prodName').value;
            const category = document.getElementById('prodCategory').value;
            const controlType = document.getElementById('prodControlType').value;
            const currentQty = parseInt(document.getElementById('prodCurrentQty').value) || 0;
            const minQty = parseInt(document.getElementById('prodMinQty').value) || 0;
            const expiryDate = document.getElementById('prodExpiryDate').value;

            const selectedSup = Array.from(document.querySelectorAll('#productSupermarketsCheckboxContainer input[name="sup_checkbox"]:checked')).map(cb => cb.value);

            if (id) {
                const item = state.storage.find(i => i.id === id);
                if (item) {
                    item.name = name;
                    item.category = category;
                    item.controlType = controlType;
                    item.currentQty = currentQty;
                    item.minQty = minQty;
                    item.expiryDate = expiryDate;
                    item.supermarkets = selectedSup;
                }
            } else {
                const newItem = {
                    id: Date.now().toString(),
                    name,
                    category,
                    controlType,
                    currentQty,
                    minQty,
                    expiryDate,
                    supermarkets: selectedSup
                };
                state.storage.push(newItem);
            }

            saveState();
            closeProductModal();
            renderApp();
        }

        function editProduct(id) {
            const item = state.storage.find(i => i.id === id);
            if (!item) return;

            document.getElementById('productId').value = item.id;
            document.getElementById('prodName').value = item.name;
            document.getElementById('prodCategory').value = item.category;
            document.getElementById('prodControlType').value = item.controlType;
            document.getElementById('prodCurrentQty').value = item.currentQty;
            document.getElementById('prodMinQty').value = item.minQty;
            document.getElementById('prodExpiryDate').value = item.expiryDate || '';
            document.getElementById('productModalTitle').innerText = 'Editar Producto';

            toggleControlTypeFields();
            renderSupermarketsCheckboxes('productSupermarketsCheckboxContainer', item.supermarkets || []);
            document.getElementById('productModal').classList.remove('hidden');
        }

        function deleteProduct(id) {
            if (confirm('¿Eliminar este producto del almacén?')) {
                state.storage = state.storage.filter(i => i.id !== id);
                saveState();
                renderApp();
            }
        }

        // GESTIÓN SUPERMERCADOS MODAL
        function openSupermarketsModal() {
            renderSupermarketsList();
            document.getElementById('supermarketModal').classList.remove('hidden');
        }

        function closeSupermarketsModal() {
            document.getElementById('supermarketModal').classList.add('hidden');
            renderApp();
        }

        function saveSupermarket(e) {
            e.preventDefault();
            const name = document.getElementById('supName').value;
            const color = document.getElementById('supColor').value;

            const newSup = {
                id: Date.now().toString(),
                name,
                color
            };
            state.supermarkets.push(newSup);
            document.getElementById('supName').value = '';
            saveState();
            renderSupermarketsList();
        }

        function renderSupermarketsList() {
            const container = document.getElementById('supermarketsList');
            if (!container) return;

            if (state.supermarkets.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400">No hay supermercados creados.</p>`;
                return;
            }

            container.innerHTML = state.supermarkets.map(sup => `
                <div class="flex items-center justify-between bg-slate-50 border border-slate-200 p-2.5 rounded-xl shadow-sm">
                    <div class="flex items-center space-x-2">
                        <span class="w-3.5 h-3.5 rounded-full" style="background-color: ${sup.color}"></span>
                        <span class="text-xs font-medium text-slate-700">${sup.name}</span>
                    </div>
                    <button onclick="deleteSupermarket('${sup.id}')" class="text-slate-400 hover:text-rose-600 p-1 text-xs transition"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('');
        }

        function deleteSupermarket(id) {
            state.supermarkets = state.supermarkets.filter(s => s.id !== id);
            saveState();
            renderSupermarketsList();
        }

        // LISTA DE LA COMPRA
        function getShoppingItems() {
            let list = [];
            
            // 1. Productos de almacén en alerta
            state.storage.forEach(item => {
                let inAlert = false;
                if (item.controlType === 'quantity' && item.currentQty <= item.minQty) {
                    inAlert = true;
                } else if (item.controlType === 'expiry' && item.expiryDate) {
                    const diffDays = Math.ceil((new Date(item.expiryDate) - new Date()) / (1000 * 60 * 60 * 24));
                    if (diffDays <= 5) inAlert = true;
                }
                if (inAlert) {
                    list.push({
                        id: 'sto_' + item.id,
                        originId: item.id,
                        name: item.name,
                        category: item.category,
                        supermarkets: item.supermarkets || [],
                        isOccasional: false
                    });
                }
            });

            // 2. Productos ocasionales añadidos
            if (state.occasionalCatalog) {
                state.occasionalCatalog.forEach(occ => {
                    list.push({
                        id: 'occ_' + occ.id,
                        originId: occ.id,
                        name: occ.name,
                        category: 'ocasional',
                        supermarkets: occ.supermarkets || [],
                        isOccasional: true
                    });
                });
            }

            return list;
        }

        function renderSupermarketFilters() {
            const container = document.getElementById('shoppingSupermarketFilters');
            if (!container) return;

            let html = `<button onclick="setShoppingSuperFilter('all')" class="px-2.5 py-1 rounded-xl text-[11px] font-medium transition shadow-sm ${state.shoppingFilterSuper === 'all' ? 'bg-indigo-600 text-white' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-50'}">Todos</button>`;

            state.supermarkets.forEach(sup => {
                const active = state.shoppingFilterSuper === sup.id;
                html += `<button onclick="setShoppingSuperFilter('${sup.id}')" class="px-2.5 py-1 rounded-xl text-[11px] font-medium transition flex items-center space-x-1.5 shadow-sm ${active ? 'ring-2 ring-indigo-500 text-white font-semibold' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-50'}" style="background-color: ${active ? sup.color : '#ffffff'}">
                    <span class="w-2 h-2 rounded-full" style="background-color: ${sup.color}"></span>
                    <span>${sup.name}</span>
                </button>`;
            });

            container.innerHTML = html;
        }

        function setShoppingSuperFilter(supId) {
            state.shoppingFilterSuper = supId;
            renderSupermarketFilters();
            renderShoppingList();
        }

        function renderShoppingList() {
            const container = document.getElementById('shoppingListContainer');
            if (!container) return;

            let items = getShoppingItems();

            if (state.shoppingFilterSuper !== 'all') {
                items = items.filter(i => i.supermarkets.includes(state.shoppingFilterSuper));
            }

            if (items.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-10 bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
                        <i class="fa-solid fa-basket-shopping text-3xl text-slate-300 mb-2"></i>
                        <p class="text-xs text-slate-500">No hay productos pendientes de compra</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = items.map(item => {
                const isChecked = state.shoppingChecked[item.id] || false;
                const supersHTML = item.supermarkets.map(supId => {
                    const sup = state.supermarkets.find(s => s.id === supId);
                    if (!sup) return '';
                    return `<span class="px-2 py-0.5 rounded-md text-[9px] font-medium text-white shadow-sm" style="background-color: ${sup.color}">${sup.name}</span>`;
                }).join(' ');

                return `
                    <div class="border ${isChecked ? 'border-slate-200 bg-slate-50/70 opacity-60' : 'border-slate-200 bg-white shadow-sm'} rounded-2xl p-3.5 flex items-center justify-between transition">
                        <div class="flex items-center space-x-3 flex-1">
                            <button onclick="toggleShoppingCheck('${item.id}')" class="w-6 h-6 rounded-lg border ${isChecked ? 'bg-indigo-600 border-indigo-600 text-white' : 'bg-slate-50 border-slate-300 text-transparent'} flex items-center justify-center text-xs transition">
                                <i class="fa-solid fa-check text-[10px]"></i>
                            </button>
                            <div class="flex-1">
                                <h4 class="font-bold text-xs ${isChecked ? 'line-through text-slate-400' : 'text-slate-900'}">${item.name}</h4>
                                <div class="flex items-center space-x-1.5 mt-1 flex-wrap">
                                    <span class="text-[10px] text-slate-400 uppercase tracking-wider">${item.isOccasional ? 'Ocasional' : item.category}</span>
                                    ${supersHTML}
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center space-x-1">
                            ${item.isOccasional ? `
                                <button onclick="removeOccasional('${item.originId}')" class="text-slate-400 hover:text-rose-600 p-2 text-xs transition" title="Eliminar de la lista"><i class="fa-solid fa-trash"></i></button>
                            ` : `
                                <button onclick="restockItem('${item.originId}')" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-600 border border-emerald-200 px-2.5 py-1.5 rounded-xl text-[11px] font-semibold transition flex items-center space-x-1 shadow-sm" title="Repuesto Comprado">
                                    <i class="fa-solid fa-check-double"></i>
                                    <span>Repuesto</span>
                                </button>
                            `}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleShoppingCheck(itemId) {
            state.shoppingChecked[itemId] = !state.shoppingChecked[itemId];
            saveState();
            renderShoppingList();
        }

        function restockItem(storageId) {
            const item = state.storage.find(i => i.id === storageId);
            if (item) {
                if (item.controlType === 'quantity') {
                    item.currentQty = item.minQty + 2;
                } else if (item.controlType === 'expiry') {
                    const d = new Date();
                    d.setMonth(d.getMonth() + 1);
                    item.expiryDate = d.toISOString().split('T')[0];
                }
                delete state.shoppingChecked['sto_' + storageId];
                saveState();
                renderApp();
            }
        }

        function updateBadge() {
            const items = getShoppingItems();
            const badge = document.getElementById('shoppingBadge');
            if (!badge) return;
            if (items.length > 0) {
                badge.innerText = items.length;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        // MODAL OCASIONAL
        function openOccasionalModal() {
            document.getElementById('occName').value = '';
            renderSupermarketsCheckboxes('occasionalSupermarketsCheckboxContainer', []);
            document.getElementById('occasionalModal').classList.remove('hidden');
        }

        function closeOccasionalModal() {
            document.getElementById('occasionalModal').classList.add('hidden');
        }

        function saveOccasionalProduct(e) {
            e.preventDefault();
            const name = document.getElementById('occName').value;
            const selectedSup = Array.from(document.querySelectorAll('#occasionalSupermarketsCheckboxContainer input[name="sup_checkbox"]:checked')).map(cb => cb.value);

            const newOcc = {
                id: Date.now().toString(),
                name,
                supermarkets: selectedSup
            };

            state.occasionalCatalog.push(newOcc);
            saveState();
            closeOccasionalModal();
            renderApp();
        }

        function removeOccasional(id) {
            state.occasionalCatalog = state.occasionalCatalog.filter(o => o.id !== id);
            delete state.shoppingChecked['occ_' + id];
            saveState();
            renderApp();
        }
    </script>
</body>
</html>
